# EXAMPLE labels: replace these with your verified labels or PARTUUIDs.
# Keep Windows first and Batocera second for the artwork mapping.
timeout 0
use_nvram false
resolution 1920 1080
scanfor manual
showtools
hideui all
enable_mouse false
enable_touch false
default_selection Windows

menuentry "Windows" {
    volume "SYSTEM"
    loader \EFI\Microsoft\Boot\bootmgfw.efi
    icon \EFI\refind-split\icons\os_win.png
}

menuentry "Batocera" {
    volume "BATOCERA"
    loader \EFI\batocera\grubx64.efi
    icon \EFI\refind-split\icons\os_linux.png
}
